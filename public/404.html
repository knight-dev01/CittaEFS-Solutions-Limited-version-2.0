<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>Page not found | CittaSL</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", ui-sans-serif, system-ui, sans-serif;
        color: #0f172a;
        background: #ffffff;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px; }
      main { width: min(100%, 560px); }
      .rule { width: 64px; height: 4px; background: #ff8e1a; margin-bottom: 28px; }
      .label { font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #2582ff; }
      h1 { margin: 14px 0 0; font-size: clamp(32px, 7vw, 48px); line-height: 1.08; letter-spacing: -0.02em; }
      p { margin: 18px 0 0; font-size: 16px; line-height: 1.7; color: #475569; }
      .links { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }
      a { display: inline-flex; align-items: center; justify-content: center; padding: 12px 18px; border-radius: 8px; font-size: 14px; font-weight: 600; text-decoration: none; }
      .primary { background: #0f172a; color: #ffffff; }
      .secondary { border: 1px solid #cbd5e1; color: #1e293b; }
      .brand { display: flex; align-items: center; gap: 10px; margin-top: 42px; font-size: 13px; color: #64748b; }
      .brand img { width: 82px; height: auto; }
    </style>
  </head>
  <body>
    <main>
      <div class="rule"></div>
      <div class="label">404 / Page not found</div>
      <h1>This page is not here.</h1>
      <p>The link may be outdated, or the page may have moved. Start from the homepage or go straight to CittaEFS.</p>
      <div class="links">
        <a class="primary" href="/">Back to homepage</a>
        <a class="secondary" href="/cittaefs">Explore CittaEFS</a>
        <a class="secondary" href="mailto:cittasl@cittanuvola.com">Contact us</a>
      </div>
      <div class="brand">
        <img src="/logo.png" alt="CittaSL logo" width="512" height="512" />
        <span>Citta ERP Solutions Limited</span>
      </div>
    </main>
  </body>
</html>
